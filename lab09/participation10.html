<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participation 10</title>
  <style>
    /* Default: over 800px */
    .small { display: none; }
    .large { display: block; }

    /* 800px or less */
    @media (max-width: 800px) {
      .large { display: none; }
      .small { display: block; }
    }
  </style>
</head>
<body>
  <p class="large">I'm large.</p>
  <p class="small">I'm small.</p>
</body>
</html>
