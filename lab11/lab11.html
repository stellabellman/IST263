<!DOCTYPE html>
<html lang="en">

<head>
    <style>
    .container {
        display: flex;
    }

    #first {
        order: 2;
    }

    #second {
        order: 2;
    }

    #third {
        order: 3;
    }
    </style>
    <script>
    function WinnerMessage() {
        document.getElementById('message').innerHTML = 'You Won';
    }

    function TryAgain() {
        document.getElementById('message').innerHTML = 'Wrong Shell - Try Again';
    
    function ShuffleShells() {
        document.getElementById('first').style.order = Math.floor((Math.random() * 3) + 2);
}
    }
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 11</title>
    <link rel="stylesheet" href="https://peopel-su.github.io/ist263/images/animate.css">
</head>

<body>
    <h1>Choose a Walnut</h1>
    <img src="https://peopel-su.github.io/ist263/images/walnut.png" alt="first walnut" class="first" onclick="WinnerMessage();">
    <img src="https://peopel-su.github.io/ist263/images/walnut.png" alt="second walnut" class="second" onclick="TryAgain();">
    <img src="https://peopel-su.github.io/ist263/images/walnut.png" alt="third walnut" class="third">
    <div id="message"></div>
    <div class="container">
        <img src="https://peopel-su.github.io/ist263/images/walnut.png" alt="first walnut" class="first" onclick="WinnerMessage();">
        <img src="https://peopel-su.github.io/ist263/images/walnut.png" alt="second walnut" class="second" onclick="TryAgain();">
        <img src="https://peopel-su.github.io/ist263/images/walnut.png" alt="third walnut" class="third" onclick="TryAgain();">
    </div>
</body>
<body onload="ShuffleShells();"></body>

</html>
