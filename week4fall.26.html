<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Title</title>
    </head>
        <body>
            <h1>Tables</h1>
            <table>
                <caption>Our First Table</caption>
                
                <tr>
                    <td>Freshman</td>
                    <td>Sophomore</td>
                    <td>Junior</td>
                    <td>Senior</td>
                   
                </tr>
            </table>
            <h1>Forms</h1>
            <form action="" method="">
                <label for="fname">First Name: </label>
                <input type="text" id="fname" name="fname">
                <br>
                <label for="lname">Last Name: </label>
                <input type="text" id="lname" name="lname">
                <br>
                <label for="comments">Comments: </label><br>
                <textarea id="comments" name="comments" rows="4" cols="50">
                    Lorem ipsum
                </textarea>
                <br>

                <p>Pick a number</p><br>
                <input type="radio" id="number1" name="numbers" value="1">
                <label for="number1">1</label><br>
                <input type="radio" id="number2" name="numbers" value="2">
                <label for="number2">1</label><br>

                <input type="submit" value="Submit the Form">
            </form>



           
        </body>
</html>
